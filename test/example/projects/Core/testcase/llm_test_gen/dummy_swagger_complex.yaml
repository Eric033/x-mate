openapi: 3.0.0
info:
  title: Order Management System API
  description: A complex dummy API for testing order management flows.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /orders:
    post:
      summary: Create a new order
      description: Places a new order for a customer.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - items
                - total_amount
              properties:
                customer_id:
                  type: string
                  description: Unique identifier of the customer.
                  example: "cust_12345"
                items:
                  type: array
                  description: List of items to order.
                  items:
                    type: object
                    properties:
                      product_id:
                        type: string
                        example: "prod_987"
                      quantity:
                        type: integer
                        example: 2
                total_amount:
                  type: number
                  format: double
                  description: Total cost of the order.
                  example: 150.50
                shipping_address:
                  type: string
                  description: Full shipping address.
                  example: "123 Main St, New York, NY"
                payment_method:
                  type: string
                  enum: [CREDIT_CARD, PAYPAL, BANK_TRANSFER]
                  description: Method of payment.
                order_date:
                  type: string
                  format: date-time
                  description: The date and time the order was placed.
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: "ord_556677"
                  status:
                    type: string
                    example: "PENDING"
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid input data

  /orders/{orderId}:
    delete:
      summary: Cancel or delete an order
      description: Cancels an existing order based on ID and provided reasons.
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          required: true
          description: The unique ID of the order to delete.
          schema:
            type: string
        - name: reason
          in: query
          required: true
          description: Reason for cancelling the order.
          schema:
            type: string
        - name: force_delete
          in: query
          description: If true, deletes immediately even if processing.
          schema:
            type: boolean
            default: false
        - name: requested_by
          in: query
          description: User ID of the person requesting the deletion (for audit).
          schema:
            type: string
      responses:
        '204':
          description: Order deleted successfully
        '403':
          description: Permission denied
        '404':
          description: Order not found
